version: '3.8'

services:
  computational-server:
    build: ./computational_backend
    ports:
      - "8002:8002"

  medical-server:
    build: ./medical_backend
    ports:
      - "8001:8001"
    environment:
      - COMPUTATIONAL_URL=http://computational-server:8002
    depends_on:
      - computational-server
    volumes:
      - ./medical_backend:/app

  medical_frontend:
    build: ./medical_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://medical-server:8001
    depends_on:
      - medical-server